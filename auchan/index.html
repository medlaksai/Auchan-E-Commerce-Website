<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script> -->
    <title>Auchan Boutique</title>
</head>

<body class="">

    <header class=" border-b border-stone-300 ">
        <nav class="px-4 py-4 md:px-8">
            <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">

                <a href="index.html" class="text-black text-center font-bold text-2xl text-black shrink-0"> <img
                        src="https://www.auchan.fr/xch/v8/content-renderer/sav_20261005-01/images/auchan-logo-desktop.svg"
                        alt=""></a>
                <div class="w-full md:max-w-md lg:max-w-xl">
                    <input type="search" name="" id="filter" placeholder="Search for a product"
                        class="w-full border border-stone-300 bg-white focus:ring-2 focus:ring-greeen-500 rounded-xl w-full h-10 text-start p-2 ">
                </div>
                <div class="flex items-center self-end md:self-auto shrink-0 h-4">
                    <button id="cart-btn" class="initial-flex items-center" aria-label="Open cart">
                        <span class="rounded-xl border border-transparent hover:bg-blue-100 hover:border-blue-500">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-shopping-basket preview-icon">
                                <path d="m15 11-1 9" />
                                <path d="m19 11-4-7" />
                                <path d="M2 11h20" />
                                <path d="m3.5 11 1.6 7.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6l1.7-7.4" />
                                <path d="M4.5 15.5h15" />
                                <path d="m5 11 4-7" />
                                <path d="m9 11 1 9" />
                            </svg>
                        </span>
                        <span id="showingPrice" class="font-bold text-black px-2"></span>
                    </button>
                </div>
        </nav>
        <div class="flex flex-wrap gap-6 mb-2 text-sm font-medium place-content-center">
                    <a href="index.html" class="hover:text-red-800 hover:underline">Home</a>
                    <a href="admin.html" class="hover:text-red-800 hover:underline">Admin</a>
                    <a href="contact.html" class="hover:text-red-800 hover:underline">Contact</a>
                </div>
                <div id="show-cart"></div>
                <aside id="cart-area">
                     <button id="close-cart" class="bg-black w-10 h-10 rounded-3xl text-white font-bold">X</button>
                     
                    <h2 class="text-center font-bold rounded-xl bg-white shadow p-2"> Votre Cart </h2>
                    <div id="productsInCart" class="grid grid-cols-1 gap-2 p-2">
                    </div>
                </aside>
    </header>
     
<main>
    <div class="px-4 py-4 flex gap-2">
        <section class="product-Catalog w-full px-4 py-4 font-bold">
            <div class="catalog-Header bg-white w-full p-2 mb-4 rounded-xl shadow-sm">
                <div class="m-2 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div class="categories flex flex-wrap items-center gap-2">
                        <button data-category="Tout" class="bg-gray-200 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            Tout
                        </button>
                        <button data-category="Vêtements" class="px-4 py-2 rounded-lg hover:bg-gray-100 transition">
                            Vêtements
                        </button>
                        <button data-category="Électronique" class="px-4 py-2 rounded-lg hover:bg-gray-100 transition">
                            Électronique
                        </button>
                        <button data-category="Maison et cuisine" class="px-4 py-2 rounded-lg hover:bg-gray-100 transition">
                            Maison et cuisine
                        </button>
                    </div>
                    <div class="flex items-center gap-3 bg-gray-100 p-2 rounded-lg w-fit">
                        <button
                            id="gridView"
                            class="hover:text-red-500 cursor-pointer transition"
                            aria-label="Grid view">
                            <svg xmlns="http://www.w3.org/2000/svg"
                                width="24" height="24"
                                viewBox="0 0 24 24"
                                fill="none" stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round">
                                <rect width="7" height="7" x="3" y="3" rx="1"/>
                                <rect width="7" height="7" x="14" y="3" rx="1"/>
                                <rect width="7" height="7" x="14" y="14" rx="1"/>
                                <rect width="7" height="7" x="3" y="14" rx="1"/>
                            </svg>
                        </button>

                        <button
                            id="listView"
                            class="hover:text-red-500 cursor-pointer transition"
                            aria-label="List view">
                            <svg xmlns="http://www.w3.org/2000/svg"
                                width="24" height="24"
                                viewBox="0 0 24 24"
                                fill="none" stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M12 3v18"/>
                                <rect width="18" height="18" x="3" y="3" rx="2"/>
                                <path d="M3 9h18"/>
                                <path d="M3 15h18"/>
                            </svg>
                        </button>

                    </div>
                </div>
            </div>
            <div id="product-container" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6">
            </div>
            <div id="pagination" class="mt-6 flexx justify-center items-center gap-2"></div>
            <div id="items" class="mt-4"></div>

        </section>
    </div>
</main>

    <script type="module" src="./js/main.js"></script>
</body>
<footer class="bg-white w-full flex flex-col items-center justify-center px-4 py-5">
    <div class="">
        <span>All Rights Are Reserved</span>
    </div>
    <div class="flex flex-wrap gap-6 mt-5 text-sm font-medium place-content-center ">
        <a href="index.html" class="hover:text-red-800 hover:underline">Home</a>
        <a href="admin.html" class="hover:text-red-800 hover:underline">Admin</a>
        <a href="contact.html" class="hover:text-red-800 hover:underline">Contact</a>
    </div>
</footer>

</html>
